name: CI

on:
  push:
    branches: [master, '2.*']
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Syntax check (bash -n)
        run: |
          bash -n files/bfd files/internals/bfd.lib.sh files/internals/elog_lib.sh files/internals/alert_lib.sh files/internals/bfd_alert.sh files/internals/pkg_lib.sh files/internals/geoip_lib.sh files/internals/bfd_report.sh files/internals/bfd_validate.sh files/internals/bfd_fw.sh files/internals/bfd_state.sh files/internals/bfd_pressure.sh files/internals/bfd_detect.sh files/internals/bfd_events.sh files/internals/bfd_diag.sh files/internals/bfd_core.sh files/internals/bfd_cdn.sh files/tlog files/internals/tlog_lib.sh files/update-ipcountry.sh files/update-cdn-providers.sh
          bash -n install.sh uninstall.sh importconf cron.daily bfd-watch.init
          bash -n pkg/deb/debian/bfd.preinst pkg/deb/debian/bfd.postinst pkg/deb/debian/bfd.prerm pkg/deb/debian/bfd.postrm
      - name: Shellcheck main scripts
        run: |
          shellcheck -S warning files/bfd files/internals/bfd.lib.sh files/internals/elog_lib.sh files/internals/alert_lib.sh files/internals/bfd_alert.sh files/internals/pkg_lib.sh files/internals/geoip_lib.sh files/internals/bfd_report.sh files/internals/bfd_validate.sh files/internals/bfd_fw.sh files/internals/bfd_state.sh files/internals/bfd_pressure.sh files/internals/bfd_detect.sh files/internals/bfd_events.sh files/internals/bfd_diag.sh files/internals/bfd_core.sh files/internals/bfd_cdn.sh files/tlog files/internals/tlog_lib.sh files/update-ipcountry.sh files/update-cdn-providers.sh
          shellcheck -S warning install.sh uninstall.sh importconf cron.daily bfd-watch.init
          shellcheck -S warning pkg/deb/debian/bfd.preinst pkg/deb/debian/bfd.postinst pkg/deb/debian/bfd.prerm pkg/deb/debian/bfd.postrm
          shellcheck -S warning -s bash --exclude=SC2207 bfd.bash-completion

  test:
    needs: lint
    uses: rfxn/batsman/.github/workflows/test.yml@v1.4.1
    with:
      project-name: bfd
      os-matrix: '["debian12","centos6","centos7","rocky8","rocky9","rocky10","ubuntu1204","ubuntu2004","ubuntu2404"]'
      parallel-jobs: 4
      file-groups: 3
      timeout: 10

  uat:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - name: Build base image
        uses: docker/build-push-action@v6
        with:
          context: tests/infra
          file: tests/infra/dockerfiles/Dockerfile.debian12
          tags: bfd-base-debian12
          load: true
          cache-from: type=gha,scope=base-debian12
          cache-to: type=gha,mode=max,scope=base-debian12
      - name: Build test image
        run: |
          docker build \
            --build-arg BASE_IMAGE=bfd-base-debian12 \
            -f tests/Dockerfile \
            -t bfd-test-debian12 .
      - name: Run UAT scenarios
        run: BATSMAN_TEST_TIMEOUT=120 make -C tests uat
      - name: Upload UAT results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-results
          path: /tmp/uat-*.log
          retention-days: 14
          if-no-files-found: ignore
