name: CI

on:
  push:
    branches: [master, '2.*']
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Syntax check (bash -n)
        run: |
          bash -n files/bfd files/bfd.lib.sh files/elog_lib.sh files/tlog files/tlog_lib.sh files/update-ipcountry.sh
          bash -n install.sh uninstall.sh importconf cron.daily bfd-watch.init
      - name: Shellcheck main scripts
        run: |
          shellcheck -S warning files/bfd files/bfd.lib.sh files/elog_lib.sh files/tlog files/tlog_lib.sh files/update-ipcountry.sh
          shellcheck -S warning install.sh uninstall.sh importconf cron.daily bfd-watch.init

  test:
    needs: lint
    uses: rfxn/batsman/.github/workflows/test.yml@v1.0.1
    with:
      project-name: bfd
      os-matrix: '["debian12","centos6","centos7","rocky8","rocky9","ubuntu1204","ubuntu2004","ubuntu2404"]'
