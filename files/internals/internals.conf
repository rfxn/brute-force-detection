#
# Internal/derived variables — users should not need to change these.
# Values are derived from INSTALL_PATH or computed at runtime.
# To change paths, modify INSTALL_PATH in bfd (not here).
#

# ensure sbin/local paths are in PATH (cron runs with minimal PATH)
PATH=/sbin:/usr/sbin:/usr/bin:/usr/local/bin:/usr/local/sbin:$PATH ; export PATH

# rule files path
RULES_PATH="$INSTALL_PATH/rules"

# compiled/downloaded data files (ipcountry.dat, cdn.dat, etc.)
DATA_PATH="${DATA_PATH:-$INSTALL_PATH/data}"

# track log script path
TLOG_PATH="$INSTALL_PATH/tlog"

# track log base run directory (byte-offset tracking files)
TLOG_BASERUN="$INSTALL_PATH/tmp"

# alert template directory (text + HTML partials)
ALERT_TEMPLATE_DIR="$INSTALL_PATH/alert"

# digest spool file path (Phase 5)
ALERT_SPOOL_FILE="$INSTALL_PATH/tmp/.alert_spool"

# list of files containing addresses excluded from bans
IGNORE_HOST_FILES="$INSTALL_PATH/exclude.files"

# lock file path
LOCK_FILE="$INSTALL_PATH/lock.utime"

# per-rule pressure overrides
PRESSURE_CONF="$INSTALL_PATH/pressure.conf"

# local time zone (used in alert template)
TIME_ZONE=$(date +"%z")

# --- Defaults for variables moved from conf.bfd (overridable) ---

# stale lock detection threshold in seconds
LOCK_FILE_TIMEOUT="${LOCK_FILE_TIMEOUT:-300}"

# syslog output target (follows KERNEL_LOG_PATH by default)
OUTPUT_SYSLOG_FILE="${OUTPUT_SYSLOG_FILE:-$KERNEL_LOG_PATH}"

# ban/unban command retry count with exponential backoff
BAN_RETRY_COUNT="${BAN_RETRY_COUNT:-2}"

# log source: auto (file with journal fallback), file, journal
LOG_SOURCE="${LOG_SOURCE:-auto}"

# attack pool retention in days (default 1 year)
APOOL_RETENTION_DAYS="${APOOL_RETENTION_DAYS:-365}"

# attack pool max lines safety cap (default 500K)
APOOL_MAX_LINES="${APOOL_MAX_LINES:-500000}"

# structured logging directory (for audit.log; app log uses BFD_LOG_PATH)
ELOG_LOG_DIR="${ELOG_LOG_DIR:-/var/log/bfd}"

# log truncation safety cap (lines; 0 = disabled)
ELOG_LOG_MAX_LINES="${ELOG_LOG_MAX_LINES:-50000}"

# max contributing IPs shown in CIDR subnet ban alert breakdown
SUBNET_ALERT_TOP_N="${SUBNET_ALERT_TOP_N:-5}"
