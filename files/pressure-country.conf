# Country pressure multipliers for BFD
#
# Format: CC MULT (whitespace-delimited)
# CC = two-letter ISO country code, MULT = integer multiplier
# Scale: 10 = 1.0x, 20 = 2.0x, 5 = 0.5x
# Unlisted countries default to 10 (1.0x, no adjustment).
#
# When any uncommented entry exists, country weighting is active automatically.
# To disable country weighting entirely, comment out or remove all entries.
#
# Examples:
#   CN 20    # 2.0x — double pressure for traffic from China
#   US 10    # 1.0x — no adjustment for US traffic
#   DE  8    # 0.8x — slightly reduced pressure for Germany
#
# Common high-risk origins (uncomment and adjust as needed):
#CN 20
#RU 20
#KP 30
#IR 15
#
# Trusted origins (uncomment to reduce sensitivity):
#US 8
#GB 8
#DE 8
#CA 8
#AU 8
