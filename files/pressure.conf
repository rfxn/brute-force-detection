exim_nxuser         weight=2  trip=30
vpopmail            weight=2  trip=20
cyrus-imap          weight=2  trip=20
rh_imapd            weight=2  trip=20
rh_ipop3d           weight=2  trip=20
vsftpd              weight=2  trip=20
vsftpd2             weight=2  trip=20
proftpd             weight=2  trip=20
pure-ftpd           weight=2  trip=20
apache-auth         weight=2  trip=20
nginx-http-auth     weight=2  trip=20
mod_sec             weight=2  trip=20
wordpress           weight=2  trip=10
roundcube           weight=2  trip=10
phpmyadmin          weight=2  trip=10
gitlab              weight=2  trip=10
grafana             weight=2  trip=10
gitea               weight=2  trip=10
nextcloud           weight=2  trip=10
