# Per-rule pressure overrides for BFD
#
# Format: rule_name:KEY=value[:KEY=value...]
# Keys:   PRESSURE_WEIGHT, PRESSURE_TRIP, SKIP_ALERT, RULE_EMAIL
#
# Precedence (highest to lowest):
#   1. Uncommented value in rule file (rules/sshd, etc.)
#   2. Value in this file (pressure.conf)
#   3. Global default in conf.bfd (PRESSURE_TRIP, PRESSURE_HALF_LIFE)
#
# Rules not listed here inherit the global PRESSURE_TRIP from conf.bfd.
# PRESSURE_WEIGHT controls how fast pressure accumulates (higher = faster).
#
# Weight tiers:
#   5 — control panels (direct server access)
#   3 — SSH, VPN, critical auth (remote shell/admin)
#   2 — mail, FTP, web auth (application-level)
#   1 — noisy/high-volume services (info-gathering)
#
# Multi-field example:
#   postfix:PRESSURE_WEIGHT=2:PRESSURE_TRIP=20:SKIP_ALERT=1

# --- Weight 5: Control panels ---
cpanel:PRESSURE_WEIGHT=5:PRESSURE_TRIP=10
plesk:PRESSURE_WEIGHT=5:PRESSURE_TRIP=10
webmin:PRESSURE_WEIGHT=5:PRESSURE_TRIP=10
directadmin:PRESSURE_WEIGHT=5:PRESSURE_TRIP=10
cockpit:PRESSURE_WEIGHT=5:PRESSURE_TRIP=10
interworx:PRESSURE_WEIGHT=5:PRESSURE_TRIP=10

# --- Weight 3: SSH / VPN / critical auth ---
sshd:PRESSURE_WEIGHT=3:PRESSURE_TRIP=15
dropbear:PRESSURE_WEIGHT=3:PRESSURE_TRIP=15
openvpn:PRESSURE_WEIGHT=3:PRESSURE_TRIP=15
openvpnas:PRESSURE_WEIGHT=3:PRESSURE_TRIP=15
proxmox:PRESSURE_WEIGHT=3:PRESSURE_TRIP=15
xrdp:PRESSURE_WEIGHT=3:PRESSURE_TRIP=15
mysqld-auth:PRESSURE_WEIGHT=3:PRESSURE_TRIP=15
postgresql:PRESSURE_WEIGHT=3:PRESSURE_TRIP=15
mongodb:PRESSURE_WEIGHT=3:PRESSURE_TRIP=15

# --- Weight 2: Mail / FTP / web auth ---
dovecot:PRESSURE_WEIGHT=2:PRESSURE_TRIP=20
courier:PRESSURE_WEIGHT=2:PRESSURE_TRIP=20
postfix:PRESSURE_WEIGHT=2:PRESSURE_TRIP=20
sendmail:PRESSURE_WEIGHT=2:PRESSURE_TRIP=20
exim_authfail:PRESSURE_WEIGHT=2:PRESSURE_TRIP=20
exim_nxuser:PRESSURE_WEIGHT=2:PRESSURE_TRIP=30
vpopmail:PRESSURE_WEIGHT=2:PRESSURE_TRIP=20
cyrus-imap:PRESSURE_WEIGHT=2:PRESSURE_TRIP=20
rh_imapd:PRESSURE_WEIGHT=2:PRESSURE_TRIP=20
rh_ipop3d:PRESSURE_WEIGHT=2:PRESSURE_TRIP=20
