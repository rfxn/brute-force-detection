# Per-rule threshold overrides for BFD
#
# Format: rule_name:KEY=value[:KEY=value...]
# Keys:   TRIG, SKIP_ALERT, RULE_EMAIL
#
# Precedence (highest to lowest):
#   1. Uncommented value in rule file (rules/sshd, etc.)
#   2. Value in this file (thresholds.conf)
#   3. Global default in conf.bfd (TRIG variable)
#
# Rules not listed here inherit the global TRIG from conf.bfd.
# To override a threshold, uncomment or add the rule line below.
# Multi-field example: postfix:TRIG=20:SKIP_ALERT=1:RULE_EMAIL=sec@example.com

sshd:TRIG=5
dropbear:TRIG=5
dovecot:TRIG=10
courier:TRIG=10
postfix:TRIG=10
sendmail:TRIG=10
exim_authfail:TRIG=10
exim_nxuser:TRIG=15
vpopmail:TRIG=10
cyrus-imap:TRIG=10
vsftpd:TRIG=10
vsftpd2:TRIG=10
proftpd:TRIG=10
pure-ftpd:TRIG=10
apache-auth:TRIG=10
nginx-http-auth:TRIG=10
modsec:TRIG=10
wordpress:TRIG=5
roundcube:TRIG=5
http_401:TRIG=30
cpanel:TRIG=5
plesk:TRIG=5
webmin:TRIG=5
directadmin:TRIG=5
pam_generic:TRIG=20
mysqld-auth:TRIG=5
postgresql:TRIG=10
named:TRIG=100
openvpnas:TRIG=5
asterisk_badauth:TRIG=5
asterisk_iax:TRIG=5
asterisk_nopeer:TRIG=5
rh_imapd:TRIG=10
rh_ipop3d:TRIG=10
openvpn:TRIG=5
phpmyadmin:TRIG=5
gitlab:TRIG=5
grafana:TRIG=5
